name: Build and publish release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { "0.1.0" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build release
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-Release.ps1 -Version "${{ steps.version.outputs.version }}" -BuildInstaller

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: W1SLEY-Edition-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.zip
            artifacts/*.txt
            artifacts/installer/*.exe

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.txt
            artifacts/installer/*.exe
